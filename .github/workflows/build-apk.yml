name: Build Android APK

on:
  workflow_dispatch:
  push:
    branches: [ main ]
    paths:
      - 'freerdp-overlay/**'
      - 'apply-overlay.sh'
      - '.github/workflows/build-apk.yml'

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 60

    steps:
      - name: Checkout rdptun overlay
        uses: actions/checkout@v4

      - name: Set up Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android SDK components
        shell: bash
        run: |
          yes | sdkmanager --licenses >/dev/null || true
          sdkmanager \
            'platforms;android-36' \
            'build-tools;36.0.0' \
            'ndk;29.0.13113456' \
            'cmake;4.1.2'

      - name: Download FreeRDP 3.31.1
        shell: bash
        run: |
          curl --fail --location --retry 5 \
            -o /tmp/freerdp.zip \
            'https://github.com/FreeRDP/FreeRDP/releases/download/3.31.1/freerdp-3.31.1.zip'
          mkdir -p /tmp/freerdp-src
          unzip -q /tmp/freerdp.zip -d /tmp/freerdp-src
          FREERDP_ROOT="$(find /tmp/freerdp-src -mindepth 1 -maxdepth 1 -type d | head -1)"
          test -n "$FREERDP_ROOT"
          echo "FREERDP_ROOT=$FREERDP_ROOT" >> "$GITHUB_ENV"

      - name: Apply rdptun overlay
        shell: bash
        run: |
          chmod +x ./apply-overlay.sh
          ./apply-overlay.sh "$FREERDP_ROOT"

      - name: Configure one ABI for MVP
        shell: bash
        run: |
          cat > "$FREERDP_ROOT/client/Android/Studio/release.properties" <<'EOF'
          COMPILE_API=36
          TARGET_API=36
          MIN_API=29
          TOOLS_VERSION=36.0.0
          NDK_VERSION=29.0.13113456
          CMAKE_VERSION=4.1.2
          VERSION_NAME=3.31.1-rdptun1
          VERSION_CODE=331011
          SPLIT_ENABLED=false
          BUILD_UNIVERSAL=true
          SPLIT_ARCHITECTURES=arm64-v8a
          ABI_FILTERS=arm64-v8a
          CMAKE_ARGUMENTS=-DWITH_FFMPEG=OFF;-DWITH_OPENH264=OFF;-DWITH_OPUS=OFF;-DWITH_WEBP=OFF;-DWITH_JPEG=OFF;-DWITH_PNG=OFF;-DWITH_CJSON=OFF;-DWITH_OPENSSL=ON
          EOF

      - name: Build debug APK
        shell: bash
        working-directory: ${{ env.FREERDP_ROOT }}/client/Android/Studio
        run: |
          chmod +x ./gradlew
          ./gradlew --no-daemon --stacktrace :rdpTunnel:assembleDebug

      - name: Locate APK
        shell: bash
        run: |
          find "$FREERDP_ROOT/client/Android/Studio/rdpTunnel/build/outputs/apk" -type f -name '*.apk' -print
          APK="$(find "$FREERDP_ROOT/client/Android/Studio/rdpTunnel/build/outputs/apk" -type f -name '*.apk' | head -1)"
          test -f "$APK"
          mkdir -p artifact
          cp "$APK" artifact/rdptun-debug.apk

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: rdptun-debug-apk
          path: artifact/rdptun-debug.apk
          if-no-files-found: error
          retention-days: 14
